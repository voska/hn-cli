version: 2

builds:
  - main: ./cmd/hn
    binary: hn
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.ShortCommit}}
      - -X main.date={{.Date}}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^chore:"
      - "^ci:"
      - "^test:"

homebrew_casks:
  - name: hn
    homepage: "https://github.com/voska/hn-cli"
    description: "Agent-friendly Hacker News CLI via the Algolia API"
    license: "MIT"
    directory: Casks
    url:
      verified: github.com/voska/hn-cli
    repository:
      owner: voska
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    commit_author:
      name: voska-bot
      email: bot@voska.dev
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/hn"]
          end

scoops:
  - name: hn
    homepage: "https://github.com/voska/hn-cli"
    description: "Agent-friendly Hacker News CLI via the Algolia API"
    license: "MIT"
    repository:
      owner: voska
      name: scoop-bucket
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
